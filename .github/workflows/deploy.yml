name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'live' || 'uat' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve deploy target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "env_name=Production"          >> "$GITHUB_OUTPUT"
            echo "is_uat=false"                 >> "$GITHUB_OUTPUT"
            echo "appsettings_file=appsettings.Production.json" >> "$GITHUB_OUTPUT"
            echo "api_host=api.blackpoolballersleague.co.uk"    >> "$GITHUB_OUTPUT"
            echo "web_host=blackpoolballersleague.co.uk"        >> "$GITHUB_OUTPUT"
            echo "www_host=www.blackpoolballersleague.co.uk"    >> "$GITHUB_OUTPUT"
            echo "blazor_remote_dir=/blackpoolballersleague.co.uk/" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=UAT"                 >> "$GITHUB_OUTPUT"
            echo "is_uat=true"                  >> "$GITHUB_OUTPUT"
            echo "appsettings_file=appsettings.UAT.json"        >> "$GITHUB_OUTPUT"
            echo "api_host=api.bristonlyfans.co.uk"             >> "$GITHUB_OUTPUT"
            echo "web_host=bristonlyfans.co.uk"                 >> "$GITHUB_OUTPUT"
            echo "www_host=www.bristonlyfans.co.uk"             >> "$GITHUB_OUTPUT"
            echo "blazor_remote_dir=/bristonlyfans.co.uk/wwwroot/" >> "$GITHUB_OUTPUT"
          fi

      - name: Write API config
        env:
          DB_CONN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LIVE_DB_CONNECTION || secrets.UAT_DB_CONNECTION }}
          ADMIN_PASS: ${{ secrets.ADMIN_SEED_PASSWORD }}
          WEB_HOST: ${{ steps.target.outputs.web_host }}
          WWW_HOST: ${{ steps.target.outputs.www_host }}
          IS_UAT: ${{ steps.target.outputs.is_uat }}
          OUT_FILE: Ballers/Ballers.API/${{ steps.target.outputs.appsettings_file }}
        run: |
          python3 <<'PY'
          import os, json
          cfg = {
            "ConnectionStrings": {"Default": os.environ["DB_CONN"]},
            "Cors": {"AllowedOrigins": [
                f"https://{os.environ['WEB_HOST']}",
                f"https://{os.environ['WWW_HOST']}"
            ]},
            "AdminSeedPassword": os.environ["ADMIN_PASS"],
          }
          if os.environ["IS_UAT"] == "true":
              cfg["IsUAT"] = True
          with open(os.environ["OUT_FILE"], "w") as f:
              json.dump(cfg, f, indent=2)
          PY

      - name: Publish API
        run: dotnet publish Ballers/Ballers.API/Ballers.API.csproj -c Release -o publish/api --nologo --self-contained true -r win-x86 /p:EnvironmentName=${{ steps.target.outputs.env_name }}

      - name: Ensure config in publish output
        env:
          APPSETTINGS_FILE: ${{ steps.target.outputs.appsettings_file }}
        run: cp "Ballers/Ballers.API/${APPSETTINGS_FILE}" "publish/api/${APPSETTINGS_FILE}"

      - name: Write Blazor config
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
          IS_UAT: ${{ steps.target.outputs.is_uat }}
        run: |
          python3 -c "import os,json; open('Ballers/Ballers.UI/wwwroot/appsettings.json','w').write(json.dumps({'ApiBaseUrl':f'https://{os.environ[\"API_HOST\"]}/','IsUAT':os.environ['IS_UAT']=='true'}))"

      - name: Publish Blazor
        run: dotnet publish Ballers/Ballers.UI/Ballers.UI.csproj -c Release -o publish/blazor --nologo

      - name: Take API offline
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
        run: |
          echo "<html><body>Deploying update, back in a moment...</body></html>" | \
          curl --ssl-reqd --insecure -T - \
            "ftp://${{ secrets.FTP_SERVER }}/${API_HOST}/app_offline.htm" \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          sleep 5

      - name: Deploy API via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: publish/api/
          server-dir: /${{ steps.target.outputs.api_host }}/

      - name: Force upload API config files
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
          APPSETTINGS_FILE: ${{ steps.target.outputs.appsettings_file }}
        run: |
          curl --ssl-reqd --insecure -T publish/api/appsettings.json \
            "ftp://${{ secrets.FTP_SERVER }}/${API_HOST}/appsettings.json" \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          curl --ssl-reqd --insecure -T "publish/api/${APPSETTINGS_FILE}" \
            "ftp://${{ secrets.FTP_SERVER }}/${API_HOST}/${APPSETTINGS_FILE}" \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: Remove stale env config files from API server
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
          APPSETTINGS_FILE: ${{ steps.target.outputs.appsettings_file }}
        run: |
          for stale in appsettings.Production.json appsettings.UAT.json; do
            if [[ "$stale" != "$APPSETTINGS_FILE" ]]; then
              curl --ssl-reqd --insecure \
                "ftp://${{ secrets.FTP_SERVER }}" \
                -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
                -Q "DELE /${API_HOST}/${stale}" \
                -v 2>&1 || echo "Note: ${stale} not present on server (ok on first deploy)"
            fi
          done

      - name: Bring API back online
        if: always()
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
        run: |
          curl --ssl-reqd --insecure \
            "ftp://${{ secrets.FTP_SERVER }}" \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -Q "DELE /${API_HOST}/app_offline.htm" \
            --fail-with-body \
            -v 2>&1 || echo "Warning: could not delete app_offline.htm — delete it manually via FTP"

      - name: Deploy Blazor via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: publish/blazor/wwwroot/
          server-dir: ${{ steps.target.outputs.blazor_remote_dir }}
          dangerous-clean-slate: true
